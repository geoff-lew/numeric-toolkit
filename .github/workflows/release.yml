name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build .plugin and .zip skill bundles
        run: |
          cd $GITHUB_WORKSPACE

          # Build .plugin (full bundle) — Claude plugin file is a zip with .plugin extension
          zip -r numeric-mcp-toolkit.plugin . \
            -x "*.git*" \
            -x "*.DS_Store" \
            -x ".github/*" \
            -x "dist/*" \
            -x "*.zip" \
            -x "*.plugin" \
            -x "*.skill"
          echo "Built: $(du -sh numeric-mcp-toolkit.plugin)"

          # Build one .zip per skill directory.
          # IMPORTANT: cd into skills/ and zip by the bare folder name so the
          # archive's top-level entry is "<skill>/SKILL.md" (single folder),
          # NOT "skills/<skill>/SKILL.md". The extra nesting hides SKILL.md
          # from Claude on install.
          rm -rf dist && mkdir -p dist
          for skill_dir in skills/*/; do
            skill=$(basename "$skill_dir")
            ( cd skills && zip -rq "../dist/${skill}.zip" "$skill" -x "*.DS_Store" )
            echo "Built: $(du -sh "dist/${skill}.zip")"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            numeric-mcp-toolkit.plugin
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Install

            **As a plugin (recommended)**
            Download `numeric-mcp-toolkit.plugin` below and open it in Cowork or Claude Code.

            **Via Claude Code CLI**
            ```
            claude plugin install https://github.com/${{ github.repository }}
            ```

            **Individual skills**
            Download any `.zip` file below and open it in Cowork or Claude Code.
